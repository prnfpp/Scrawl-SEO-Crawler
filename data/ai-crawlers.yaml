  - { nome: Applebot-Extended, azienda: Apple, scopo: controllo, rispetta: "si", fonte: "https://support.apple.com/en-us/119829", verificato: "2026-11-15" }
  - { nome: meta-externalagent, azienda: Meta, scopo: addestramento, rispetta: "non dichiarato", fonte: "https://developers.facebook.com/docs/sharing/webmasters/web-crawlers/", verificato: "2026-11-15" }
  - { nome: meta-webindexer, azienda: Meta, scopo: ricerca, rispetta: "non dichiarato", fonte: "https://developers.facebook.com/docs/sharing/webmasters/web-crawlers/", verificato: "2026-11-15" }
